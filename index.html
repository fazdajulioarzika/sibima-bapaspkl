<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIBIMA | Balai Pemasyarakatan Kelas II Pekalongan</title>
    <style>
      canvas {
        position: fixed;
        inset: 0;
        z-index: -1;
      }
    </style>
  </head>
  <body class="bg-gradient-to-br from-blue-800 via-indigo-900 to-sky-700">
    <canvas id="bgCanvas"></canvas>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      const canvas = document.getElementById("bgCanvas");
      const ctx = canvas.getContext("2d");

      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener("resize", () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        init();
      });

      const isMobile = window.innerWidth < 768;
      const count = isMobile ? 10 : 20; // ringan banget

      let squares = [];

      function random(min, max) {
        return Math.random() * (max - min) + min;
      }

      // create squares
      function init() {
        squares = [];

        for (let i = 0; i < count; i++) {
          squares.push({
            x: random(0, width),
            y: random(0, height),
            size: random(20, 60),
            speed: random(1, 1.8),
            rotate: random(0, 360),
            rotateSpeed: random(-1, 1),
            opacity: random(0.3, 0.7),
            drift: random(-0.3, 0.3),
            radius: random(4, 20),
          });
        }
      }

      // draw rounded square
      function drawRoundedRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);

        for (let s of squares) {
          s.y -= s.speed;
          s.x += s.drift;
          s.rotate += s.rotateSpeed;

          // reset kalau keluar atas
          if (s.y + s.size < 0) {
            s.y = height + random(20, 100);
            s.x = random(0, width);
          }

          ctx.save();
          ctx.translate(s.x, s.y);
          ctx.rotate((s.rotate * Math.PI) / 180);

          ctx.globalAlpha = s.opacity;
          ctx.fillStyle = "white";

          drawRoundedRect(-s.size / 2, -s.size / 2, s.size, s.size, s.radius);

          ctx.fill();
          ctx.restore();
        }

        requestAnimationFrame(animate);
      }

      init();
      animate();
    </script>
  </body>
</html>
