<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIBIMA | Balai Pemasyarakatan Kelas II Pekalongan</title>
    <style>
      .stars-container {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        pointer-events: none;
        z-index: -1;
      }

      .star {
        position: absolute;
        bottom: -120px;
        background: rgba(255, 255, 255, 0.7);
        opacity: 0.7;
        border-radius: 16px;
        animation: floatUp linear infinite;
      }

      @keyframes floatUp {
        0% {
          transform: translateY(0) rotate(0deg);
          opacity: 0;
        }

        10% {
          opacity: 0.7;
        }

        100% {
          transform: translateY(-120vh) rotate(720deg);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body class="bg-gradient-to-br from-blue-800 via-indigo-900 to-sky-700">
    <div class="stars-container"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      const starsContainer = document.querySelector(".stars-container");
      const numStars = 15;

      for (let i = 0; i < numStars; i++) {
        const square = document.createElement("div");
        square.classList.add("star");

        // random size
        const size = Math.random() * 70 + 20;

        // random position
        square.style.left = `${Math.random() * 95}%`;

        // size
        square.style.width = `${size}px`;
        square.style.height = `${size}px`;

        // border radius random
        square.style.borderRadius = `${Math.random() * 25 + 8}px`;

        // animation speed random
        square.style.animationDuration = `${Math.random() * 12 + 8}s`;

        // start delay random
        square.style.animationDelay = `${Math.random() * 10}s`;

        // optional blur/glass effect
        square.style.backdropFilter = "blur(8px)";
        square.style.border = "1px solid rgba(255,255,255,0.3)";
        square.style.boxShadow = "0 8px 24px rgba(255,255,255,0.15)";

        starsContainer.appendChild(square);
      }
    </script>
  </body>
</html>
